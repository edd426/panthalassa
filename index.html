<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06202b" />
    <meta name="description" content="Panthalassa — an aquatic evolution simulation to watch." />
    <title>Panthalassa</title>
    <style>
      /*
        WP-A6 crude shell. One full-window canvas with two text overlays; the
        status block never takes pointer events so every click reaches the
        water, while the inspector panel does, so its dump can be selected.
      */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #03151d;
        color: #cfe9f2;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #world {
        position: fixed;
        inset: 0;
        display: block;
        cursor: crosshair;
      }

      #status {
        position: fixed;
        top: 10px;
        left: 12px;
        margin: 0;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
        color: #d8f2ff;
      }

      #panel {
        position: fixed;
        top: 10px;
        right: 12px;
        width: min(74ch, 52vw);
        max-height: calc(100vh - 20px);
        overflow: auto;
        margin: 0;
        padding: 8px 10px;
        white-space: pre;
        font-size: 11px;
        line-height: 1.35;
        color: #bcdfe9;
        background: rgba(3, 21, 29, 0.82);
        border: 1px solid rgba(150, 210, 230, 0.25);
      }

      /*
        Extinction banner. An empty ocean is indistinguishable from a paused
        one, so when the run ends it has to say so from across the room.
      */
      #banner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 28px 44px;
        white-space: pre;
        text-align: center;
        pointer-events: none;
        font-size: 20px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        color: #ffd9d0;
        background: rgba(8, 6, 14, 0.86);
        border: 1px solid rgba(255, 130, 100, 0.55);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.65);
      }

      #banner[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <pre id="status"></pre>
    <pre id="panel"></pre>
    <div id="banner" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
